name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Show Swift toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Check browser JavaScript
        run: |
          sed -n '/<script>/,/<\/script>/p' Sources/JevBassistCLI/Resources/index.html \
            | sed '1d;$d' > "$RUNNER_TEMP/jev-bassist-ui.js"
          node --check "$RUNNER_TEMP/jev-bassist-ui.js"
          node Tests/visual_demo_smoke.js
      - name: Test
        run: swift test
      - name: Test memory safety
        run: swift test --sanitize=address
